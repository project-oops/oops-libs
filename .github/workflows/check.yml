name: check

# The standard OOPS preamble: check out the collection, this repository into it, then
# bootstrap siblings (none are needed here). See the collection's docs/BUILDING.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-libs

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap oops-libs
        env:
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      # Relays to ./bin/oops-libs check: rustfmt, clippy and tests, all features.
      - name: oops check oops-libs
        run: OOPS/bin/oops check oops-libs
