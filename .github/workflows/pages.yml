name: Deploy docs to GitHub Pages

# Publishes docs/ only; `/` redirects to it. oops-libs is a library, not a project, so it has
# no landing page.

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE-*"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site bundle
    runs-on: ubuntu-latest
    steps:
      # The standard OOPS preamble.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-libs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap oops-libs
        env:
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      - name: Assemble bundle
        run: |
          set -euo pipefail
          mkdir -p site
          # The collection's shared renderer. Grey, because this is not one of the projects.
          bash ../tools/build-docs.sh . site "#8b9096" "oops-libs"
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=docs/">
          <title>oops-libs</title>
          <a href="docs/">oops-libs documentation</a>
          HTML
          du -sh site
        working-directory: OOPS/oops-libs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: OOPS/oops-libs/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
