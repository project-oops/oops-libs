[workspace]
resolver = "2"
members = ["crates/*"]

# Versions are pinned once for all crates. Nothing here is required by every crate: extra
# destinations and the platform directory lookup are behind features.
[workspace.dependencies]
# `attributes` (`#[instrument]`) is off; nothing here uses it.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# A matched set: tracing-opentelemetry 0.28 builds against opentelemetry 0.27.
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = "0.27"
dirs = "5"
# Pinned to the egui the GUIs use, so one binary holds one egui.
egui = "0.29"
# No default features: the HTML writer is not used.
pulldown-cmark = { version = "0.12", default-features = false }

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/project-oops/oops-libs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
