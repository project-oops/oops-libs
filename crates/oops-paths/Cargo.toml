[package]
name = "oops-paths"
description = "Where a tool keeps what it writes, including when it is running portable."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Only the platform-native layout needs it; the home layout is `std` alone.
dirs = { workspace = true, optional = true }

[features]
# On by default because the default layout is the platform's own.
default = ["platform-dirs"]
platform-dirs = ["dep:dirs"]

[lints]
workspace = true
