[package]
name = "oops-log"
description = "One way to turn logging on, for every tool in the collection. Levels, a file, and OTLP when asked."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Destinations past stderr are optional, so a small CLI compiles none of them.
tracing-appender = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

[features]
default = []
# A rolling file on disk.
file = ["dep:tracing-appender"]
# OTLP span export. The consumer supplies a running tokio runtime.
otlp = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[lints]
workspace = true
